# Predictable — installed as <gateway conf.d>/predictable.conf by deploy/deploy.sh --gateway,
# which fills in __DOMAIN__ (canonical) and __NAMES__ (it plus www.__DOMAIN__ when
# that resolves here). Self-contained so it works on any gateway that mounts
# /etc/letsencrypt. predictable_app is resolved at request time, so the gateway
# still starts while Predictable is down.

server {
    listen 80;
    server_name __NAMES__;

    # certbot --webroot -w /etc/letsencrypt/webroot
    location /.well-known/acme-challenge/ {
        root /etc/letsencrypt/webroot;
    }

    location / {
        return 301 https://__DOMAIN__$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name __NAMES__;

    if ($host != __DOMAIN__) {
        return 301 https://__DOMAIN__$request_uri;
    }

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Gameweek predictions run Monte Carlo simulations per fixture.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    resolver 127.0.0.11 valid=30s;
    set $predictable http://predictable_app:8000;

    location / {
        proxy_pass $predictable;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
